---
- name: "Verify"
  hosts: "all"
  tasks:
    - name: "Check verify directory exists"
      ansible.builtin.stat:
        path: "/opt/pgbackrest-restore-verify"
      register: "verify_dir"

    - name: "Assert verify directory exists"
      ansible.builtin.assert:
        that:
          - "verify_dir.stat.exists"
          - "verify_dir.stat.isdir"

    - name: "Check verify script exists"
      ansible.builtin.stat:
        path: "/opt/pgbackrest-restore-verify/verify.sh"
      register: "verify_script"

    - name: "Assert verify script exists and is executable"
      ansible.builtin.assert:
        that:
          - "verify_script.stat.exists"
          - "verify_script.stat.mode == '0700'"

    - name: "Get verify timer status"
      ansible.builtin.systemd:
        name: "postgres-pgbackrest-restore-verify.timer"
      register: "verify_timer"

    - name: "Assert verify timer is enabled and active"
      ansible.builtin.assert:
        that:
          - "verify_timer.status.UnitFileState == 'enabled'"
          - "verify_timer.status.ActiveState == 'active'"

    - name: "Read timer unit file"
      ansible.builtin.slurp:
        src: "/etc/systemd/system/postgres-pgbackrest-restore-verify.timer"
      register: "timer_unit"

    - name: "Assert timer schedule is configured"
      vars:
        content: "{{ timer_unit.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'OnCalendar=Sun *-*-* 06:00:00 UTC' in content"
          - "'Persistent=true' in content"

    - name: "Read service unit file"
      ansible.builtin.slurp:
        src: "/etc/systemd/system/postgres-pgbackrest-restore-verify.service"
      register: "service_unit"

    - name: "Assert service runs the verify script"
      vars:
        content: "{{ service_unit.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'ExecStart=/opt/pgbackrest-restore-verify/verify.sh' in content"
          - "'OnFailure=email-root@%n.service' in content"

    - name: "Run verify script manually"
      ansible.builtin.command:
        cmd: "/opt/pgbackrest-restore-verify/verify.sh"
      register: "verify_run"
      changed_when: false

    - name: "Assert verify script passed"
      ansible.builtin.assert:
        that:
          - "verify_run.rc == 0"
          - "'PASS' in verify_run.stdout"
          - "'FAIL' not in verify_run.stdout"
          - "'All verification queries passed.' in verify_run.stdout"

    - name: "Check for leftover verify container"
      ansible.builtin.command:
        cmd: >-
          docker ps -a
          --filter name=pgbackrest-restore-verify
          --format "{% raw %}{{.Names}}{% endraw %}"
      register: "leftover_container"
      changed_when: false

    - name: "Assert no leftover verify container"
      ansible.builtin.assert:
        that:
          - "leftover_container.stdout | trim | length == 0"

    - name: "Check for leftover restore directories"
      ansible.builtin.find:
        paths: "/opt/pgbackrest-restore-verify"
        patterns: "restore.*"
        file_type: "directory"
      register: "leftover_dirs"

    - name: "Assert no leftover restore directories"
      ansible.builtin.assert:
        that:
          - "leftover_dirs.files | length == 0"
