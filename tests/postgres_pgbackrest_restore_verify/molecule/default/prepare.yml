---
- name: "Prepare"
  hosts: "all"
  tasks:
    - name: "Make apt resilient to transient CDN failures"
      ansible.builtin.include_role:
        name: "system_apt_retries"

    - name: "Install Docker"
      ansible.builtin.include_role:
        name: "docker_install"
      vars:
        docker_install_storage_driver: "vfs"

    - name: "Create Docker network"
      ansible.builtin.include_role:
        name: "docker_network_create"
      vars:
        docker_network_create_name: "postgres_network"

    - name: "Create S3 bucket and certs directory"
      ansible.builtin.file:
        path: "{{ item }}"
        state: "directory"
        mode: "0755"
      loop:
        - "/opt/s3/test-backup-bucket"
        - "/opt/s3-certs"

    # pgBackRest only speaks TLS to object stores, so the S3 server needs a
    # self-signed certificate
    - name: "Generate self-signed TLS certificate for the S3 server"
      ansible.builtin.command:
        cmd: >-
          openssl req -x509 -newkey rsa:2048 -nodes -days 365
          -keyout /opt/s3-certs/private.key
          -out /opt/s3-certs/public.crt
          -subj "/CN=s3"
          -addext "subjectAltName=DNS:s3,DNS:localhost,IP:127.0.0.1"
        creates: "/opt/s3-certs/public.crt"

    - name: "Start S3 server with TLS"
      ansible.builtin.command:
        cmd: >-
          docker run -d
          --name s3
          --network postgres_network
          -p 9000:9000
          -v /opt/s3:/data
          -v /opt/s3-certs:/certs
          -e ROOT_ACCESS_KEY=test
          -e ROOT_SECRET_KEY=testpassword
          versity/versitygw:v1.8.0
          --port :9000 --health /health
          --cert /certs/public.crt --key /certs/private.key
          posix /data
      changed_when: true

    - name: "Wait for S3 server to be ready"
      ansible.builtin.uri:
        url: "https://localhost:9000/health"
        status_code: 200
        validate_certs: false
      register: "s3_health"
      until: "s3_health.status == 200"
      retries: 30
      delay: 5

    - name: "Install and start PostgreSQL with pgBackRest"
      ansible.builtin.include_role:
        name: "postgres_pgbackrest_install"
      vars:
        postgres_pgbackrest_install_password: "testpassword123"
        postgres_pgbackrest_install_network: "postgres_network"
        postgres_pgbackrest_install_repos:
          - type: "s3"
            path: "/pgbackrest"
            s3-endpoint: "s3"
            s3-bucket: "test-backup-bucket"
            s3-region: "us-east-1"
            s3-key: "test"
            s3-key-secret: "testpassword"
            s3-uri-style: "path"
            storage-port: 9000
            storage-verify-tls: "n"
            cipher-type: "aes-256-cbc"
            cipher-pass: "testcipherpass"
            retention-full: 2

    - name: "Seed users table"
      ansible.builtin.command:
        cmd: >-
          docker exec postgres
          psql -U postgres -c
          "CREATE TABLE users (name text);
          INSERT INTO users VALUES ('alice'), ('bob'), ('charlie');"
      changed_when: true

    - name: "Run full backup"
      ansible.builtin.command:
        cmd: "/opt/postgres/backup.sh full"
      changed_when: true
