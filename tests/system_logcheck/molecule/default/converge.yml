---
- name: "Converge"
  hosts: "all"
  tasks:
    - name: "Apply role under test"
      ansible.builtin.include_role:
        name: "system_logcheck"
      vars:
        system_logcheck_enable_journal: true
        system_logcheck_enable_syslog: false
        system_logcheck_custom_rules:
          - ".*I am a custom logcheck rule test that should be filtered out.*$"
