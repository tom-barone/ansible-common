---
- name: "Verify"
  hosts: "all"
  tasks:
    # Given traefik was installed
    # When we check for the binary
    # Then it exists and is executable
    - name: "Check binary exists"
      ansible.builtin.stat:
        path: "/usr/local/bin/traefik"
      register: "_traefik_binary"

    - name: "Assert binary exists and is executable"
      ansible.builtin.assert:
        that:
          - "_traefik_binary.stat.exists"
          - "_traefik_binary.stat.executable"

    # Given traefik was installed
    # When we check the systemd service
    # Then it is active
    - name: "Check service status"
      ansible.builtin.systemd:
        name: "traefik"
      register: "_traefik_service"

    - name: "Assert service is running"
      ansible.builtin.assert:
        that:
          - "_traefik_service.status.ActiveState == 'active'"

    # Given traefik was installed with web entrypoint
    # When we check port 80
    # Then it is listening
    - name: "Check port 80 is listening"
      ansible.builtin.wait_for:
        port: 80
        timeout: 5

    # Given traefik was installed with websecure entrypoint
    # When we check port 443
    # Then it is listening
    - name: "Check port 443 is listening"
      ansible.builtin.wait_for:
        port: 443
        timeout: 5

    # Given traefik was installed with dashboard enabled
    # When we check port 8080
    # Then it is listening
    - name: "Check port 8080 is listening"
      ansible.builtin.wait_for:
        port: 8080
        timeout: 5

    # Given traefik was installed with routes
    # When we read the routes config
    # Then the passthrough route forwards TLS unterminated and the
    # terminated route redirects HTTP and terminates TLS via letsencrypt
    - name: "Read routes config"
      ansible.builtin.slurp:
        src: "/etc/traefik/routes.yml"
      register: "_traefik_routes"

    - name: "Assert routes contain configured routes"
      vars:
        _routes_content: >-
          {{ _traefik_routes.content | b64decode }}
      ansible.builtin.assert:
        that:
          - "'app.example.com' in _routes_content"
          - "'passthrough: true' in _routes_content"
          - '''address: "10.0.0.10:443"'' in _routes_content'
          - "'api.example.com' in _routes_content"
          - "'certResolver: letsencrypt' in _routes_content"
          - "'redirect-to-https' in _routes_content"
          - '''url: "http://10.0.0.20:8080"'' in _routes_content'

    - name: "Check the TLS terminated TCP route"
      vars:
        _tcp: "{{ (_traefik_routes.content | b64decode | from_yaml).tcp }}"
      block:
        # Given a TLS terminated TCP route for mqtt.example.com
        # When we read its router from the routes config
        # Then it terminates TLS via letsencrypt
        - name: "Assert the TCP route terminates TLS via letsencrypt"
          ansible.builtin.assert:
            that:
              - >-
                _tcp.routers['mqtt-example-com-tcp-tls-router'].tls
                == {'certResolver': 'letsencrypt'}

        # Given a TLS terminated TCP route to 10.0.0.30 port 1883
        # When we read its service from the routes config
        # Then it forwards to that address
        - name: "Assert the TCP route forwards to the destination"
          ansible.builtin.assert:
            that:
              - >-
                _tcp.services['mqtt-example-com-tcp-tls-service'].loadBalancer
                == {'servers': [{'address': '10.0.0.30:1883'}]}

    # Given traefik loaded the dynamic routes config
    # When we read the traefik journal
    # Then it contains no configuration building errors
    - name: "Read traefik journal"
      ansible.builtin.command:
        cmd: "journalctl -u traefik --no-pager"
      register: "_traefik_journal"
      changed_when: false

    - name: "Assert no configuration errors in journal"
      ansible.builtin.assert:
        that:
          - >-
            'Error while building configuration'
            not in _traefik_journal.stdout
          - >-
            'nonexistent certificate resolver'
            not in _traefik_journal.stdout

    # Given a TLS terminated route was configured
    # When we read the traefik config
    # Then it contains the ACME certificate resolver
    - name: "Read traefik config"
      ansible.builtin.slurp:
        src: "/etc/traefik/traefik.yml"
      register: "_traefik_config"

    - name: "Assert traefik config contains ACME resolver"
      vars:
        _config_content: >-
          {{ _traefik_config.content | b64decode }}
      ansible.builtin.assert:
        that:
          - "'certificatesResolvers' in _config_content"
          - "'email: test@example.com' in _config_content"
          - "'httpChallenge' in _config_content"

    # Given only a TLS terminated TCP route is configured
    # When we read the traefik config
    # Then it still contains the ACME certificate resolver
    - name: "Apply the role with only a TLS terminated TCP route"
      ansible.builtin.include_role:
        name: "traefik_install"
      vars:
        traefik_install_acme_email: "test@example.com"
        traefik_install_tls_terminated_tcp_routes:
          - domain: "mqtt.example.com"
            destination: "10.0.0.30"
            port: 1883

    - name: "Read traefik config of the TCP route alone"
      ansible.builtin.slurp:
        src: "/etc/traefik/traefik.yml"
      register: "_traefik_tcp_config"

    - name: "Assert a TCP route alone gets the ACME resolver"
      ansible.builtin.assert:
        that:
          - "'certificatesResolvers' in _traefik_tcp_config.content | b64decode"
