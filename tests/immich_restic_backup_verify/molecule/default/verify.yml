---
- name: "Verify"
  hosts: "all"
  tasks:
    - name: "Check verify directory exists"
      ansible.builtin.stat:
        path: "/opt/immich-backup-verify"
      register: "verify_dir"

    - name: "Assert verify directory exists"
      ansible.builtin.assert:
        that:
          - "verify_dir.stat.exists"
          - "verify_dir.stat.isdir"

    - name: "Check verify script exists"
      ansible.builtin.stat:
        path: "/opt/immich-backup-verify/verify.sh"
      register: "verify_script"

    - name: "Assert verify script exists and is executable"
      ansible.builtin.assert:
        that:
          - "verify_script.stat.exists"
          - "verify_script.stat.mode == '0700'"

    - name: "Get verify timer status"
      ansible.builtin.systemd:
        name: "immich-restic-backup-verify.timer"
      register: "verify_timer"

    - name: "Assert verify timer is enabled and active"
      ansible.builtin.assert:
        that:
          - "verify_timer.status.UnitFileState == 'enabled'"
          - "verify_timer.status.ActiveState == 'active'"

    - name: "Read timer unit file"
      ansible.builtin.slurp:
        src: "/etc/systemd/system/immich-restic-backup-verify.timer"
      register: "timer_unit"

    - name: "Assert timer schedule is configured"
      vars:
        content: "{{ timer_unit.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'OnCalendar=Sun *-*-* 05:00:00 UTC' in content"
          - "'Persistent=true' in content"

    - name: "Read service unit file"
      ansible.builtin.slurp:
        src: "/etc/systemd/system/immich-restic-backup-verify.service"
      register: "service_unit"

    - name: "Assert service runs the verify script"
      vars:
        content: "{{ service_unit.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'ExecStart=/opt/immich-backup-verify/verify.sh' in content"
          - "'OnFailure=email-root@%n.service' in content"

    - name: "Check legacy cron job file"
      ansible.builtin.stat:
        path: "/etc/cron.d/immich-restic-backup-verify"
      register: "legacy_cron"

    - name: "Assert legacy cron job file is absent"
      ansible.builtin.assert:
        that:
          - "not legacy_cron.stat.exists"

    - name: "Run verify script manually"
      ansible.builtin.command:
        cmd: "/opt/immich-backup-verify/verify.sh"
      register: "verify_run"
      changed_when: true

    - name: "Assert verification succeeded"
      ansible.builtin.assert:
        that:
          - "'Backup verification succeeded.' in verify_run.stdout"
          - >-
            'PASS: /opt/immich-backup/db/pg_dumpall.sql'
            in verify_run.stdout

    - name: "Check restore directory was cleaned up"
      ansible.builtin.stat:
        path: "/opt/immich-backup-verify/restore"
      register: "restore_dir"

    - name: "Assert restore directory was cleaned up"
      ansible.builtin.assert:
        that:
          - "not restore_dir.stat.exists"
