# AI GENERATED - Tom Barone
---
- name: "Verify"
  hosts: "all"
  vars:
    url: "http://127.0.0.1:9931"
  tasks:
    - name: "Get llama-cpp-server service status"
      ansible.builtin.systemd:
        name: "llama-cpp-server"
      register: "service"

    # Given the role is applied
    # When systemd is queried
    # Then the service is enabled and running
    - name: "Assert service is enabled and running"
      ansible.builtin.assert:
        that:
          - "service.status.UnitFileState == 'enabled'"
          - "service.status.ActiveState == 'active'"
        msg: "llama-cpp-server is not enabled and running"

    - name: "Find downloaded models"
      ansible.builtin.find:
        paths: "/srv/models"
        patterns: "*.gguf"
        recurse: true
        file_type: "any"
      register: "models"

    # Given llama_cpp_server_cache_dir is "/srv/models"
    # When the role is applied
    # Then the model is downloaded there
    - name: "Assert the model is in the cache directory"
      ansible.builtin.assert:
        that:
          - "models.matched > 0"
        msg: "No model found in /srv/models"

    - name: "Read the model presets"
      ansible.builtin.slurp:
        src: "/etc/llama-cpp-server/models.ini"
      register: "presets"

    # Given the stories preset sets no-mmproj to the YAML boolean true
    # When the presets are rendered
    # Then the value is lower case, as llama.cpp reads "True" as false
    - name: "Assert booleans are rendered in lower case"
      ansible.builtin.assert:
        that:
          - "'no-mmproj = true' in presets.content | b64decode"
        msg: "{{ presets.content | b64decode }}"

    - name: "List served models"
      ansible.builtin.uri:
        url: "{{ url }}/v1/models"
      register: "served"

    # Given two presets that point at the same cached model
    # When the router lists its models
    # Then it lists the presets by name, without the cache entry
    - name: "Assert the router serves the presets by name"
      vars:
        ids: "{{ served.json.data | map(attribute='id') | sort }}"
      ansible.builtin.assert:
        that:
          - "ids == ['stories', 'stories-big']"
        msg: "Expected stories and stories-big, got {{ ids }}"

    - name: "Request a completion from stories"
      ansible.builtin.uri:
        url: "{{ url }}/completion"
        method: "POST"
        body_format: "json"
        body:
          model: "stories"
          prompt: "Once upon a time"
          n_predict: 8
      register: "completion"

    # Given the stories model is not loaded
    # When a completion names it
    # Then the router loads it and the model generates text
    - name: "Assert the model generates text"
      ansible.builtin.assert:
        that:
          - "completion.json.content | length > 0"
        msg: "The completion returned no content"

    - name: "Get stories properties"
      ansible.builtin.uri:
        url: "{{ url }}/props?model=stories"
      register: "props"

    # Given the stories preset sets ctx-size to 256
    # When its properties are requested
    # Then the context size is 256, so the preset reached the model
    - name: "Assert preset settings are passed to the model"
      ansible.builtin.assert:
        that:
          - "props.json.default_generation_settings.n_ctx == 256"
        msg: >-
          Expected n_ctx 256, got
          {{ props.json.default_generation_settings.n_ctx }}

    - name: "Request a completion from stories-big"
      ansible.builtin.uri:
        url: "{{ url }}/completion"
        method: "POST"
        body_format: "json"
        body:
          model: "stories-big"
          prompt: "Once upon a time"
          n_predict: 8

    - name: "Get model status"
      ansible.builtin.uri:
        url: "{{ url }}/models"
      register: "status"

    # Given llama_cpp_server_args contains "--models-max 1"
    # When a second model is loaded
    # Then the router unloads the first, so the flag reached it
    - name: "Assert extra args are passed to the router"
      vars:
        stories: >-
          {{ status.json.data | selectattr('id', 'eq', 'stories') | first }}
      ansible.builtin.assert:
        that:
          - "stories.status.value == 'unloaded'"
        msg: "Expected stories to be unloaded, got {{ stories.status }}"
