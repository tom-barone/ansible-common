---
- name: "Create QEMU VM"
  hosts: "localhost"
  connection: "local"
  gather_facts: false
  tasks:
    - name: "Build the Proxmox VE test image"
      ansible.builtin.include_role:
        name: "proxmox_setup_test_image"
      vars:
        proxmox_setup_test_image_dir: "{{ lookup('env', 'CACHE_DIR') }}"

    - name: "Create VM"
      ansible.builtin.include_role:
        name: "qemu_vm_create"
      vars:
        qemu_vm_create_name: "pve-nosub-vm"
        qemu_vm_create_ssh_port: 2241
        qemu_vm_create_memory: "2G"
        qemu_vm_create_disk_size: "32G"
        qemu_vm_create_base_image: "{{ proxmox_setup_test_image_path }}"
