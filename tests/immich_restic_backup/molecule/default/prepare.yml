---
- name: "Prepare"
  hosts: "all"
  tasks:
    - name: "Install Docker"
      ansible.builtin.include_role:
        name: "docker_install"
      vars:
        docker_install_storage_driver: "vfs"

    - name: "Create media directories"
      ansible.builtin.file:
        path: "/opt/immich/data/{{ item }}"
        state: "directory"
        mode: "0755"
      loop:
        - "library"
        - "upload"
        - "profile"

    # Immich leaves this marker in every media directory; the restore
    # guard must not count it as media
    - name: "Create Immich marker files"
      ansible.builtin.copy:
        content: ""
        dest: "/opt/immich/data/{{ item }}/.immich"
        mode: "0644"
      loop:
        - "library"
        - "upload"
        - "profile"

    - name: "Start stand-in Immich server container"
      ansible.builtin.command:
        cmd: >-
          docker run -d
          --name immich_server
          alpine:3.22 sleep infinity
      changed_when: true

    - name: "Create S3 bucket"
      ansible.builtin.file:
        path: "/opt/s3/test-backup-bucket"
        state: "directory"
        mode: "0755"

    - name: "Start S3 server"
      ansible.builtin.command:
        cmd: >-
          docker run -d
          --name s3
          -p 9000:9000
          -v /opt/s3:/data
          -e ROOT_ACCESS_KEY=test
          -e ROOT_SECRET_KEY=testpassword
          versity/versitygw:v1.8.0
          --port :9000 --health /health
          posix /data
      changed_when: true

    - name: "Wait for S3 server to be ready"
      ansible.builtin.uri:
        url: "http://localhost:9000/health"
        status_code: 200
      register: "s3_health"
      until: "s3_health.status == 200"
      retries: 30
      delay: 5

    - name: "Seed restic repo by applying role once"
      ansible.builtin.include_role:
        name: "immich_restic_backup"
      vars:
        immich_restic_backup_repository: >-
          s3:http://localhost:9000/test-backup-bucket
        immich_restic_backup_env:
          AWS_ACCESS_KEY_ID: "test"
          AWS_SECRET_ACCESS_KEY: "testpassword"
        immich_restic_backup_restic_password: "testpassword"

    - name: "Create marker media file to restore"
      ansible.builtin.copy:
        content: "immich-marker-media"
        dest: "/opt/immich/data/library/marker.jpg"
        mode: "0644"

    - name: "Run backup script to snapshot seeded data"
      ansible.builtin.command:
        cmd: "/opt/immich-backup/backup.sh"
      changed_when: true

    - name: "Remove marker media file before converge"
      ansible.builtin.file:
        path: "/opt/immich/data/library/marker.jpg"
        state: "absent"
