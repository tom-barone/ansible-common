---
- name: "Converge"
  hosts: "all"
  tasks:
    - name: "Apply role under test"
      ansible.builtin.include_role:
        name: "user_create_admin"
      vars:
        user_create_admin_username: "testadmin"
        user_create_admin_ssh_public_key: >-
          ssh-ed25519 AAAAC3 test@test
        user_create_admin_password: "testpassword"

    - name: "Apply role under test with only required vars"
      ansible.builtin.include_role:
        name: "user_create_admin"
      vars:
        user_create_admin_username: "testminimal"
