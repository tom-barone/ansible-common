# AI GENERATED - Tom Barone
---
- name: "Verify"
  hosts: "all"
  tasks:
    # Given a Debian system without a desktop
    # When the role is applied
    # Then the gnome-core package is installed
    - name: "Check gnome-core package is installed"
      ansible.builtin.command: "dpkg -s gnome-core"
      changed_when: false

    # Given a Debian system without a desktop
    # When the role is applied
    # Then the network-manager package is installed
    - name: "Check network-manager package is installed"
      ansible.builtin.command: "dpkg -s network-manager"
      changed_when: false

    - name: "Get systemd-resolved service status"
      ansible.builtin.systemd:
        name: "systemd-resolved"
      register: "resolved_service"

    # Given a Debian system without a desktop
    # When the role is applied
    # Then systemd-resolved starts at boot
    - name: "Assert systemd-resolved service is enabled"
      ansible.builtin.assert:
        that:
          - "resolved_service.status.UnitFileState == 'enabled'"
        msg: "systemd-resolved service is not enabled"

    - name: "Read ifupdown interfaces config"
      ansible.builtin.slurp:
        src: "/etc/network/interfaces"
      register: "interfaces_config"

    # Given eth0 is configured by ifupdown
    # When the role is applied
    # Then ifupdown no longer configures eth0
    - name: "Assert ifupdown no longer configures eth0"
      ansible.builtin.assert:
        that:
          - "'eth0' not in (interfaces_config.content | b64decode)"
        msg: "eth0 is still configured by ifupdown"

    - name: "Read GNOME Software allow-updates from the user dconf profile"
      ansible.builtin.command: "dconf read /org/gnome/software/allow-updates"
      register: "allow_updates"
      changed_when: false

    # Given a Debian system without a desktop
    # When the role is applied
    # Then GNOME Software does not check for updates
    - name: "Assert GNOME Software allow-updates is false"
      ansible.builtin.assert:
        that:
          - "allow_updates.stdout == 'false'"
        msg: "allow-updates is {{ allow_updates.stdout }}"

    - name: "Read GNOME Software download-updates from the user dconf profile"
      ansible.builtin.command: "dconf read /org/gnome/software/download-updates"
      register: "download_updates"
      changed_when: false

    # Given a Debian system without a desktop
    # When the role is applied
    # Then GNOME Software does not refresh the package cache
    - name: "Assert GNOME Software download-updates is false"
      ansible.builtin.assert:
        that:
          - "download_updates.stdout == 'false'"
        msg: "download-updates is {{ download_updates.stdout }}"
