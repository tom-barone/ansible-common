---
- name: "Verify"
  hosts: "all"
  vars:
    container_name: "scrutiny"
    scrutiny_port: 8080
  tasks:
    - name: "Check install directory exists"
      ansible.builtin.stat:
        path: "/opt/scrutiny"
      register: "install_dir"

    - name: "Assert install directory exists"
      ansible.builtin.assert:
        that:
          - "install_dir.stat.exists"
          - "install_dir.stat.isdir"

    - name: "Read docker-compose.yml"
      ansible.builtin.slurp:
        src: "/opt/scrutiny/docker-compose.yml"
      register: "compose_file"

    - name: "Assert docker-compose.yml contains expected content"
      vars:
        content: "{{ compose_file.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "container_name in content"

    # Given lsblk reports physical, virtual and optical disks
    # When the role is applied with one explicit and one ignored device
    # Then only the explicit and the discovered physical disks are mapped
    - name: "Assert docker-compose.yml maps the monitored devices"
      vars:
        compose: "{{ compose_file.content | b64decode | from_yaml }}"
        expected:
          - source: "/dev/disk/by-id/wwn-0xssd"
            target: "/dev/disk/by-id/wwn-0xssd"
            permissions: "rwm"
          - source: "/dev/disk/by-id/wwn-0xhdd"
            target: "/dev/disk/by-id/wwn-0xhdd"
            permissions: "rwm"
          - source: "/dev/disk/by-id/nvme-eui.1"
            target: "/dev/disk/by-id/nvme-eui.1"
            permissions: "rwm"
          - source: "/dev/disk/by-id/usb-WD_Elements-0:0"
            target: "/dev/disk/by-id/usb-wd_elements-0:0"
            permissions: "rwm"
      ansible.builtin.assert:
        that:
          - "compose.services.scrutiny.devices == expected"
        msg: "Unexpected devices: {{ compose.services.scrutiny.devices }}"

    - name: "Read collector.yaml"
      ansible.builtin.slurp:
        src: "/opt/scrutiny/config/collector.yaml"
      register: "collector_yaml"

    # Given lsblk reports physical, virtual and optical disks
    # When the role is applied with one explicit and one ignored device
    # Then the explicit entry comes first and replaces its discovered one,
    # and each discovered physical disk follows with its smartctl type
    - name: "Assert collector.yaml lists the monitored devices"
      vars:
        collector: "{{ collector_yaml.content | b64decode | from_yaml }}"
        expected:
          - device: "/dev/disk/by-id/wwn-0xssd"
            type: "sntasmedia"
          - device: "/dev/disk/by-id/wwn-0xhdd"
            type: "sat"
          - device: "/dev/disk/by-id/nvme-eui.1"
            type: "nvme"
          - device: "/dev/disk/by-id/usb-WD_Elements-0:0"
            type: "sat"
      ansible.builtin.assert:
        that:
          - "collector.devices == expected"
        msg: "Unexpected devices: {{ collector.devices }}"

    - name: "Validate compose config"
      ansible.builtin.command:
        cmd: "docker compose config --quiet"
        chdir: "/opt/scrutiny"
      changed_when: false

    - name: "Check container is running"
      ansible.builtin.command:
        cmd: "docker compose ps"
        chdir: "/opt/scrutiny"
      register: "compose_ps"
      changed_when: false

    - name: "Assert scrutiny container is listed"
      ansible.builtin.assert:
        that:
          - "container_name in compose_ps.stdout"

    # Given a by-id name with uppercase letters and a colon
    # When the container is started
    # Then the disk is a block device at the lowercased path the collector uses
    - name: "Check the USB disk is mapped into the container"
      ansible.builtin.command:
        argv:
          - "docker"
          - "exec"
          - "{{ container_name }}"
          - "test"
          - "-b"
          - "/dev/disk/by-id/usb-wd_elements-0:0"
      changed_when: false

    - name: "Check Scrutiny responds on HTTP port"
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ scrutiny_port }}/"
        status_code: 200
      register: "scrutiny_http"
      until: "scrutiny_http.status == 200"
      retries: 30
      delay: 2

    - name: "Read scrutiny.yaml"
      ansible.builtin.slurp:
        src: "/opt/scrutiny/config/scrutiny.yaml"
      register: "scrutiny_yaml"

    - name: "Assert scrutiny.yaml contains notify URL"
      vars:
        content: "{{ scrutiny_yaml.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'discord://token@id' in content"

    - name: "Read Scrutiny settings via API"
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ scrutiny_port }}/api/settings"
        method: "GET"
        return_content: true
      register: "verify_settings"

    - name: "Assert repeat_notifications was applied"
      vars:
        metrics: "{{ verify_settings.json.settings.metrics }}"
      ansible.builtin.assert:
        that:
          - "metrics.repeat_notifications == false"
