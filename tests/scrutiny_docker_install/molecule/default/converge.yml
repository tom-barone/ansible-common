---
- name: "Converge"
  hosts: "all"
  tasks:
    - name: "Apply role under test"
      ansible.builtin.include_role:
        name: "scrutiny_docker_install"
      vars:
        scrutiny_docker_install_notify_urls:
          - "discord://token@id"
        scrutiny_docker_install_repeat_notifications: false
        scrutiny_docker_install_devices:
          - device: "/dev/disk/by-id/wwn-0xssd"
            type: "sntasmedia"
          - device: "/dev/disk/by-id/usb-NoSmart"
            ignore: true
