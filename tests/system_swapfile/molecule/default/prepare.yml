---
- name: "Prepare"
  hosts: "all"
  tasks:
    - name: "Make apt resilient to transient CDN failures"
      ansible.builtin.include_role:
        name: "system_apt_retries"

    - name: "Install stress-ng for swap stress test"
      ansible.builtin.apt:
        name: "stress-ng"
        state: "present"
        update_cache: true
        cache_valid_time: 3600
