---
- name: "Converge"
  hosts: "all"
  tasks:
    - name: "Apply role under test"
      ansible.builtin.include_role:
        name: "postgres_pgbackrest_install"
      vars:
        postgres_pgbackrest_install_password: "testpassword123"
        postgres_pgbackrest_install_network: "postgres_network"
        postgres_pgbackrest_install_repos:
          - type: "s3"
            path: "/pgbackrest"
            s3-endpoint: "minio"
            s3-bucket: "test-backup-bucket-1"
            s3-region: "us-east-1"
            s3-key: "test"
            s3-key-secret: "testpassword"
            s3-uri-style: "path"
            storage-port: 9000
            storage-verify-tls: "n"
            cipher-type: "aes-256-cbc"
            cipher-pass: "testcipherpass"
            retention-full: 2
          - type: "s3"
            path: "/pgbackrest"
            s3-endpoint: "minio"
            s3-bucket: "test-backup-bucket-2"
            s3-region: "us-east-1"
            s3-key: "test"
            s3-key-secret: "testpassword"
            s3-uri-style: "path"
            storage-port: 9000
            storage-verify-tls: "n"
            cipher-type: "aes-256-cbc"
            cipher-pass: "testcipherpass"
            retention-full: 2
