---
- name: "Verify"
  hosts: "all"
  tasks:
    - name: "Check miniupnpc is installed"
      ansible.builtin.command: "dpkg -s miniupnpc"
      register: "miniupnpc_status"
      changed_when: false

    - name: "Assert miniupnpc package is installed"
      ansible.builtin.assert:
        that:
          - "miniupnpc_status.rc == 0"
        msg: "miniupnpc package is not installed"

    - name: "Check upnpc binary exists"
      ansible.builtin.command: "which upnpc"
      register: "upnpc_binary"
      changed_when: false

    - name: "Assert upnpc binary exists"
      ansible.builtin.assert:
        that:
          - "upnpc_binary.rc == 0"
        msg: "upnpc binary not found"

    - name: "Get refresh timer status"
      ansible.builtin.systemd:
        name: "upnpc-refresh-9090-tcp.timer"
      register: "refresh_timer"

    - name: "Assert refresh timer is enabled and active"
      ansible.builtin.assert:
        that:
          - "refresh_timer.status.UnitFileState == 'enabled'"
          - "refresh_timer.status.ActiveState == 'active'"
        msg: "Refresh timer should be running after add role"

    - name: "Apply system_port_forward_remove role"
      ansible.builtin.include_role:
        name: "system_port_forward_remove"
      vars:
        system_port_forward_remove_external_port: "9090"
        system_port_forward_remove_protocol: "TCP"

    - name: "Check timer unit file after remove"
      ansible.builtin.stat:
        path: "/etc/systemd/system/upnpc-refresh-9090-tcp.timer"
      register: "timer_after_remove"

    - name: "Check service unit file after remove"
      ansible.builtin.stat:
        path: "/etc/systemd/system/upnpc-refresh-9090-tcp.service"
      register: "service_after_remove"

    - name: "Assert refresh timer units were removed"
      ansible.builtin.assert:
        that:
          - "not timer_after_remove.stat.exists"
          - "not service_after_remove.stat.exists"
        msg: "Timer units should be removed"
