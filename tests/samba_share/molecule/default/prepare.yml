# AI GENERATED - Tom Barone
---
- name: "Prepare"
  hosts: "all"
  tasks:
    - name: "Make apt resilient to transient CDN failures"
      ansible.builtin.include_role:
        name: "system_apt_retries"

    - name: "Install SMB and mDNS clients for verification"
      ansible.builtin.apt:
        name:
          - "avahi-utils"
          - "smbclient"
          # mkfs.ext4 to format the test disks
          - "e2fsprogs"
        state: "present"
        update_cache: true
        cache_valid_time: 3600

    - name: "Create a login user in the users group"
      ansible.builtin.user:
        name: "dave"
        groups: "users"
        append: true

    # Stand in for freshly formatted disks with a root:root 0755 root.
    # Not tmpfs, as Docker Desktop's kernel has no ACLs on tmpfs.
    - name: "Create disk images"
      community.general.filesize:
        path: "{{ item }}.img"
        size: "64M"
      loop:
        - "/srv/media"
        - "/srv/private"

    - name: "Format disk images"
      community.general.filesystem:
        dev: "{{ item }}.img"
        fstype: "ext4"
      loop:
        - "/srv/media"
        - "/srv/private"

    - name: "Mount filesystems to share"
      ansible.builtin.include_role:
        name: "system_mount"
      vars:
        system_mount_path: "{{ item }}"
        system_mount_state: "mounted"
        system_mount_src: "{{ item }}.img"
        system_mount_fstype: "ext4"
        system_mount_opts: "loop"
      loop:
        - "/srv/media"
        - "/srv/private"
