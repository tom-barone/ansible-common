# AI GENERATED - Tom Barone
---
- name: "Verify"
  hosts: "all"
  vars:
    media: "//localhost/media"
  tasks:
    - name: "Gather service facts"
      ansible.builtin.service_facts: {}

    # Given the role was applied
    # When we check the smbd service
    # Then it is running and enabled at boot
    - name: "Assert smbd is running and enabled"
      vars:
        service: "{{ ansible_facts.services['smbd.service'] }}"
      ansible.builtin.assert:
        that:
          - "service.state == 'running'"
          - "service.status == 'enabled'"
        msg: "smbd is not running and enabled"

    # Given the role was applied
    # When we check the avahi-daemon service
    # Then it is running and enabled at boot
    - name: "Assert avahi-daemon is running and enabled"
      vars:
        service: "{{ ansible_facts.services['avahi-daemon.service'] }}"
      ansible.builtin.assert:
        that:
          - "service.state == 'running'"
          - "service.status == 'enabled'"
        msg: "avahi-daemon is not running and enabled"

    # Given the role was applied
    # When we check the wsdd2 service
    # Then it is running and enabled at boot
    - name: "Assert wsdd2 is running and enabled"
      vars:
        service: "{{ ansible_facts.services['wsdd2.service'] }}"
      ansible.builtin.assert:
        that:
          - "service.state == 'running'"
          - "service.status == 'enabled'"
        msg: "wsdd2 is not running and enabled"

    # Given smbd is running
    # When we check port 445
    # Then it is listening
    - name: "Check port 445 is listening"
      ansible.builtin.wait_for:
        port: 445
        timeout: 5

    - name: "Browse for SMB services over mDNS"
      ansible.builtin.command:
        argv:
          - "avahi-browse"
          - "--resolve"
          - "--terminate"
          - "--parsable"
          - "_smb._tcp"
      register: "smb_services"
      changed_when: false

    # Given smbd and avahi-daemon are running
    # When a macOS client browses for SMB services
    # Then the host is advertised on port 445
    - name: "Assert the host is advertised over mDNS"
      ansible.builtin.assert:
        that:
          - "smb_services.stdout_lines | select('match', '^=;.*;445;$')
            | list | length > 0"
        msg: "SMB service not advertised: {{ smb_services.stdout }}"

    - name: "Get a Samba user account"
      ansible.builtin.getent:
        database: "passwd"
        key: "alice"

    # Given the role created an account for a Samba user
    # When we read its passwd entry
    # Then it is a system account that can't log in
    - name: "Assert the Samba user is a system account without a shell"
      ansible.builtin.assert:
        that:
          - "getent_passwd['alice'][1] | int < 1000"
          - "getent_passwd['alice'][5] == '/usr/sbin/nologin'"
        msg: "alice is not a nologin system account"

    - name: "Stat the share directory"
      ansible.builtin.stat:
        path: "/srv/media"
      register: "share_dir"

    # Given a freshly mounted filesystem with a root:root 0755 root
    # When the role shares it
    # Then the root is group writable by the forced group, with setgid
    - name: "Assert the share directory is root:users 2775"
      ansible.builtin.assert:
        that:
          - "share_dir.stat.pw_name == 'root'"
          - "share_dir.stat.gr_name == 'users'"
          - "share_dir.stat.mode == '2775'"
        msg: "share directory has wrong owner, group or mode"

    # Given alice has a read_write credential
    # When she uploads a file
    # Then the upload succeeds
    - name: "Upload a file as a read_write user"
      ansible.builtin.command:
        argv:
          - "smbclient"
          - "{{ media }}"
          - "--user=alice%alicepassword"
          - "--command=put /etc/hostname shared.txt"
      changed_when: false

    - name: "Stat the uploaded file"
      ansible.builtin.stat:
        path: "/srv/media/shared.txt"
      register: "shared_file"

    # Given alice uploaded a file
    # When we stat it on the server
    # Then it has the forced group and is group writable
    - name: "Assert the uploaded file is group users and 0664"
      ansible.builtin.assert:
        that:
          - "shared_file.stat.gr_name == 'users'"
          - "shared_file.stat.mode == '0664'"
        msg: "uploaded file has wrong group or mode"

    # Given alice uploaded a file
    # When bob, another read_write user, overwrites it
    # Then the upload succeeds
    - name: "Overwrite the file as another read_write user"
      ansible.builtin.command:
        argv:
          - "smbclient"
          - "{{ media }}"
          - "--user=bob%bobpassword"
          - "--command=put /etc/os-release shared.txt"
      changed_when: false

    # Given alice uploaded a file over Samba
    # When dave, a login user in the users group, appends to it
    # Then the write succeeds
    - name: "Append to the uploaded file as a login user"
      ansible.builtin.shell: "echo dave >> /srv/media/shared.txt"
      become: true
      become_user: "dave"
      changed_when: false

    - name: "Create a file as a login user with a umask of 022"
      ansible.builtin.shell: "umask 022 && echo dave > /srv/media/dave.txt"
      become: true
      become_user: "dave"
      changed_when: false

    # Given dave created a file locally with a umask of 022
    # When bob, a read_write user, overwrites it over Samba
    # Then the upload succeeds
    - name: "Overwrite a login user's file as a read_write user"
      ansible.builtin.command:
        argv:
          - "smbclient"
          - "{{ media }}"
          - "--user=bob%bobpassword"
          - "--command=put /etc/hostname dave.txt"
      changed_when: false

    # Given carol has a read_only credential
    # When she downloads a file
    # Then the download succeeds
    - name: "Download the file as a read_only user"
      ansible.builtin.command:
        argv:
          - "smbclient"
          - "{{ media }}"
          - "--user=carol%carolpassword"
          - "--command=get shared.txt /dev/null"
      changed_when: false

    - name: "Upload a file as a read_only user"
      ansible.builtin.command:
        argv:
          - "smbclient"
          - "{{ media }}"
          - "--user=carol%carolpassword"
          - "--command=put /etc/hostname carol.txt"
      register: "read_only_upload"
      changed_when: false
      failed_when: false

    # Given carol has a read_only credential
    # When she uploads a file
    # Then access is denied
    - name: "Assert a read_only user can't write"
      ansible.builtin.assert:
        that:
          - "'NT_STATUS_ACCESS_DENIED' in read_only_upload.stdout"
        msg: "carol could write: {{ read_only_upload.stdout }}"

    - name: "Connect to another share as a user it doesn't list"
      ansible.builtin.command:
        argv:
          - "smbclient"
          - "//localhost/private"
          - "--user=bob%bobpassword"
          - "--command=ls"
      register: "other_share"
      changed_when: false
      failed_when: false

    # Given bob only has a credential for the media share
    # When he connects to the private share
    # Then access is denied
    - name: "Assert a user can't reach a share it isn't listed on"
      ansible.builtin.assert:
        that:
          - "'NT_STATUS_ACCESS_DENIED' in other_share.stdout"
        msg: "bob reached the private share: {{ other_share.stdout }}"

    - name: "Connect with a wrong password"
      ansible.builtin.command:
        argv:
          - "smbclient"
          - "{{ media }}"
          - "--user=alice%wrongpassword"
          - "--command=ls"
      register: "wrong_password"
      changed_when: false
      failed_when: false

    # Given alice has a credential
    # When she connects with the wrong password
    # Then the logon fails
    - name: "Assert a wrong password is rejected"
      ansible.builtin.assert:
        that:
          - "'NT_STATUS_LOGON_FAILURE' in wrong_password.stdout"
        msg: "wrong password was accepted: {{ wrong_password.stdout }}"

    - name: "Connect anonymously"
      ansible.builtin.command:
        argv:
          - "smbclient"
          - "{{ media }}"
          - "--no-pass"
          - "--command=ls"
      register: "anonymous"
      changed_when: false
      failed_when: false

    # Given guest access is never mapped
    # When a client connects without credentials
    # Then access is denied
    - name: "Assert anonymous access is denied"
      ansible.builtin.assert:
        that:
          - "'NT_STATUS_ACCESS_DENIED' in anonymous.stdout"
        msg: "anonymous access was allowed: {{ anonymous.stdout }}"

    - name: "Write an alternate data stream"
      ansible.builtin.command:
        argv:
          - "smbclient"
          - "{{ media }}"
          - "--user=alice%alicepassword"
          - "--command=put /etc/hostname streams.txt;
            put /etc/hostname streams.txt:test; allinfo streams.txt"
      register: "streams"
      changed_when: false

    # Given vfs streams_xattr is enabled for macOS metadata
    # When a client writes an alternate data stream
    # Then the file lists the stream
    - name: "Assert alternate data streams are stored"
      ansible.builtin.assert:
        that:
          - "'stream: [:test:$DATA]' in streams.stdout"
        msg: "alternate data stream missing: {{ streams.stdout }}"
