# AI GENERATED - Tom Barone
---
- name: "Verify"
  hosts: "all"
  tasks:
    - name: "Read the pool health"
      ansible.builtin.command: "zpool list -H -o health tank"
      register: "health"
      changed_when: false

    # Given four blank disks
    # When the role creates a raidz2 pool on them
    # Then the pool is online
    - name: "Assert the pool is online"
      ansible.builtin.assert:
        that:
          - "health.stdout == 'ONLINE'"
        msg: "pool health is {{ health.stdout }}"

    # Given the role created the pool
    # When we check its default mountpoint
    # Then the pool is mounted there
    - name: "Check the pool is mounted under /media"
      ansible.builtin.command: "mountpoint --quiet /media/tank"
      changed_when: false

    - name: "Read the ACL type of the pool"
      ansible.builtin.command: "zfs get -H -o value acltype tank"
      register: "acltype"
      changed_when: false

    # Given the role created the pool
    # When we read its ACL type
    # Then POSIX ACLs are enabled
    - name: "Assert POSIX ACLs are enabled"
      ansible.builtin.assert:
        that:
          - "acltype.stdout == 'posix'"
        msg: "acltype is {{ acltype.stdout }}"

    - name: "Create a pool on a disk that is already in one"
      block:
        - name: "Apply the role to a disk of the existing pool"
          ansible.builtin.include_role:
            name: "zfs_pool"
          vars:
            zfs_pool_name: "other"
            zfs_pool_type: "stripe"
            zfs_pool_disks:
              - "/var/tmp/zfs-disk-0.img"

        - name: "Record that the role succeeded"
          ansible.builtin.set_fact:
            used_disk_refused: false
      rescue:
        - name: "Record that the role failed"
          ansible.builtin.set_fact:
            used_disk_refused: true

    # Given a disk that already belongs to a pool
    # When the role is asked to create another pool on it
    # Then the role fails
    - name: "Assert the role refuses a disk that isn't blank"
      ansible.builtin.assert:
        that:
          - "used_disk_refused"
        msg: "the role created a pool on a disk that wasn't blank"

    - name: "Apply the role with another mountpoint"
      ansible.builtin.include_role:
        name: "zfs_pool"
      vars:
        zfs_pool_name: "tank"
        zfs_pool_mountpoint: "/mnt/tank"
        zfs_pool_disks:
          - "/var/tmp/zfs-disk-0.img"
          - "/var/tmp/zfs-disk-1.img"
          - "/var/tmp/zfs-disk-2.img"
          - "/var/tmp/zfs-disk-3.img"

    # Given the pool is mounted under /media
    # When the role runs with another mountpoint
    # Then the pool is mounted there
    - name: "Check the pool is mounted at the new mountpoint"
      ansible.builtin.command: "mountpoint --quiet /mnt/tank"
      changed_when: false

    # Given the pool is mounted under /media
    # When the role runs with another mountpoint
    # Then nothing is mounted at the old one
    - name: "Check nothing is mounted at the old mountpoint"
      ansible.builtin.command: "mountpoint --quiet /media/tank"
      register: "old_mountpoint"
      changed_when: false
      failed_when: "old_mountpoint.rc == 0"

    - name: "Add an fstab entry that shows the pool in the file manager"
      ansible.builtin.include_role:
        name: "system_mount"
      vars:
        system_mount_path: "/mnt/tank"
        system_mount_state: "present"
        system_mount_src: "tank"
        system_mount_fstype: "zfs"
        system_mount_opts: "noauto,zfsutil,x-gvfs-show"

    - name: "Reboot"
      ansible.builtin.reboot: {}

    # Given the pool has a noauto entry in fstab
    # When the machine reboots
    # Then ZFS mounts the pool itself
    - name: "Check the pool is mounted after a reboot"
      ansible.builtin.command: "mountpoint --quiet /mnt/tank"
      changed_when: false
