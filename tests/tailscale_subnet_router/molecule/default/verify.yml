---
- name: "Verify"
  hosts: "all"
  vars:
    forwarding_sysctls:
      - "net.ipv4.ip_forward"
      - "net.ipv6.conf.all.forwarding"
  tasks:
    # Given Tailscale was installed in the prepare step
    # When we check for the tailscale binary
    # Then it exists on the system
    - name: "Check tailscale binary exists"
      ansible.builtin.command: "which tailscale"
      changed_when: false

    # Given the subnet router role was applied
    # When we check the forwarding sysctl values
    # Then IPv4 and IPv6 forwarding are set to 1
    - name: "Check IP forwarding is enabled"
      ansible.builtin.command:
        argv: ["sysctl", "-n", "{{ item }}"]
      loop: "{{ forwarding_sysctls }}"
      register: "forwarding"
      changed_when: false

    - name: "Assert IP forwarding is enabled"
      ansible.builtin.assert:
        that:
          - "forwarding.results | map(attribute='stdout') | list == ['1', '1']"
        msg: "IP forwarding is not enabled"

    # Given the subnet router role was applied
    # When we read the sysctl config file
    # Then it holds both settings, so they survive a reboot
    - name: "Read sysctl config file"
      ansible.builtin.slurp:
        src: "/etc/sysctl.d/99-tailscale.conf"
      register: "sysctl_conf"

    - name: "Assert sysctl config contains the forwarding settings"
      ansible.builtin.assert:
        that:
          - "item in sysctl_conf.content | b64decode"
        msg: "sysctl config missing {{ item }}"
      loop: "{{ forwarding_sysctls }}"

    # Given tailscale_subnet_router_routes is left empty
    # When we check the routes the node advertises
    # Then it is the subnet the machine is directly connected to
    - name: "Get advertised routes"
      ansible.builtin.command:
        argv: ["tailscale", "get", "advertise-routes"]
      register: "advertised_routes"
      changed_when: false

    - name: "Assert the local subnet is advertised"
      vars:
        _local_subnet: >-
          {{ ansible_facts['default_ipv4']['network'] }}/{{
          ansible_facts['default_ipv4']['prefix'] }}
      ansible.builtin.assert:
        that:
          - "advertised_routes.stdout == _local_subnet"
        msg: "Expected {{ _local_subnet }}, got {{ advertised_routes.stdout }}"

    # Given tailscale_subnet_router_routes lists two subnets
    # When the role is applied and we check the routes the node advertises
    # Then it is those two subnets, in place of the local one
    - name: "Apply the role with explicit routes"
      ansible.builtin.include_role:
        name: "tailscale_subnet_router"
      vars:
        tailscale_subnet_router_routes:
          - "198.51.100.0/24"
          - "192.0.2.0/24"

    - name: "Get advertised routes again"
      ansible.builtin.command:
        argv: ["tailscale", "get", "advertise-routes"]
      register: "explicit_routes"
      changed_when: false

    - name: "Assert the explicit routes are advertised"
      ansible.builtin.assert:
        that:
          - >-
            explicit_routes.stdout.split(',') | sort
            == ['192.0.2.0/24', '198.51.100.0/24']
        msg: "Expected the explicit routes, got {{ explicit_routes.stdout }}"
