# AI GENERATED - Tom Barone
---
- name: "Prepare"
  hosts: "all"
  tasks:
    # SSH is up before Proxmox has finished its first boot, which creates
    # the node's directories in /etc/pve and refreshes the apt cache.
    - name: "Wait for Proxmox to finish its first boot"
      ansible.builtin.systemd:
        name: "multi-user.target"
      register: "multi_user_target"
      until: "multi_user_target.status.ActiveState == 'active'"
      retries: 60
      delay: 2

    # A Linux guest gets a modern machine type, so Proxmox attaches the USB
    # device to an xhci controller like it would on a real host. The test
    # host has no nested virtualisation, so KVM is disabled or qm showcmd
    # refuses to build the QEMU command line.
    - name: "Create VMs to pass the USB device through to"
      ansible.builtin.command:
        argv:
          - "qm"
          - "create"
          - "{{ item }}"
          - "--name"
          - "test-vm-{{ item }}"
          - "--ostype"
          - "l26"
          - "--kvm"
          - "0"
        creates: "/etc/pve/qemu-server/{{ item }}.conf"
      loop:
        - 100
        - 101

    # Without nested virtualisation a VM can never really run. A VM counts
    # as running while /tmp/qm-running-<id> exists. Starts, shutdowns and
    # guest agent calls are logged instead of done. Everything else passes
    # through to the real qm.
    - name: "Mark VM 101 as running"
      ansible.builtin.file:
        path: "/tmp/qm-running-101"
        state: "touch"
        mode: "0644"

    - name: "Install mock qm wrapper"
      ansible.builtin.copy:
        dest: "/usr/local/bin/qm"
        mode: "0755"
        content: |
          #!/bin/bash
          case "$1" in
            start)
              touch "/tmp/qm-running-$2"
              echo "$1" >> "/tmp/qm-$2.log"
              ;;
            shutdown)
              rm "/tmp/qm-running-$2"
              echo "$1" >> "/tmp/qm-$2.log"
              ;;
            status)
              if [ -f "/tmp/qm-running-$2" ]; then
                echo "status: running"
              else
                exec /usr/sbin/qm "$@"
              fi
              ;;
            guest)
              echo "wait" >> "/tmp/qm-$3.log"
              cat <<'JSON'
          [{"name":"eth0","ip-addresses":[{"ip-address":"10.0.2.15","ip-address-type":"ipv4"}]}]
          JSON
              ;;
            *)
              exec /usr/sbin/qm "$@"
              ;;
          esac
