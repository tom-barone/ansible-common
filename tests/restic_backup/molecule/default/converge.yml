---
- name: "Converge"
  hosts: "all"
  tasks:
    - name: "Apply role under test"
      ansible.builtin.include_role:
        name: "restic_backup"
      vars:
        restic_backup_dir: "/opt/restic-backup"
        restic_backup_job_name: "restic-backup"
        restic_backup_repository: >-
          s3:http://localhost:9000/test-backup-bucket/myapp
        restic_backup_env:
          AWS_ACCESS_KEY_ID: "test"
          AWS_SECRET_ACCESS_KEY: "testpassword"
        restic_backup_restic_password: "testpassword"
        restic_backup_path: "/opt/test-data"
        # A percentage subset of a tiny test repo could select no pack
        # files at all, so read everything.
        restic_backup_verify_read_data_subset: "100%"
        # Dates in the past, so the timers never fire in the middle of
        # the test.
        restic_backup_timer_schedule: "2000-01-01 00:00:00 UTC"
        restic_backup_verify_timer_schedule: "2000-01-02 00:00:00 UTC"
