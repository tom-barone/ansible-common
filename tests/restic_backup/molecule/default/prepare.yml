---
- name: "Prepare"
  hosts: "all"
  tasks:
    - name: "Make apt resilient to transient CDN failures"
      ansible.builtin.include_role:
        name: "system_apt_retries"

    - name: "Install Docker"
      ansible.builtin.include_role:
        name: "docker_install"
      vars:
        docker_install_storage_driver: "vfs"

    - name: "Create S3 bucket"
      ansible.builtin.file:
        path: "/opt/s3/test-backup-bucket"
        state: "directory"
        mode: "0755"

    - name: "Start S3 server"
      ansible.builtin.command:
        cmd: >-
          docker run -d
          --name s3
          -p 9000:9000
          -v /opt/s3:/data
          -e ROOT_ACCESS_KEY=test
          -e ROOT_SECRET_KEY=testpassword
          versity/versitygw:v1.8.0
          --port :9000 --health /health
          posix /data
      changed_when: true

    - name: "Wait for S3 server to be ready"
      ansible.builtin.uri:
        url: "http://localhost:9000/health"
        status_code: 200
      register: "s3_health"
      until: "s3_health.status == 200"
      retries: 30
      delay: 5

    - name: "Create test data directory"
      ansible.builtin.file:
        path: "/opt/test-data"
        state: "directory"
        mode: "0755"

    - name: "Create test file"
      ansible.builtin.copy:
        dest: "/opt/test-data/hello.txt"
        content: "hello from restic backup test"
        mode: "0644"
