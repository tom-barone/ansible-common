---
- name: "Verify"
  hosts: "all"
  tasks:
    - name: "Check miniupnpc is installed"
      ansible.builtin.command: "dpkg -s miniupnpc"
      register: "miniupnpc_status"
      changed_when: false

    - name: "Assert miniupnpc package is installed"
      ansible.builtin.assert:
        that:
          - "miniupnpc_status.rc == 0"
        msg: "miniupnpc package is not installed"

    - name: "Check upnpc binary exists"
      ansible.builtin.command: "which upnpc"
      register: "upnpc_binary"
      changed_when: false

    - name: "Assert upnpc binary exists"
      ansible.builtin.assert:
        that:
          - "upnpc_binary.rc == 0"
        msg: "upnpc binary not found"

    - name: "Check chronic binary exists"
      ansible.builtin.command: "which chronic"
      register: "chronic_binary"
      changed_when: false

    - name: "Assert chronic binary exists"
      ansible.builtin.assert:
        that:
          - "chronic_binary.rc == 0"
        msg: "chronic binary not found"

    - name: "Read refresh service unit"
      ansible.builtin.slurp:
        src: "/etc/systemd/system/upnpc-refresh-9090-tcp.service"
      register: "refresh_service_unit"

    - name: "Assert refresh service runs upnpc via chronic"
      ansible.builtin.assert:
        that:
          - >-
            'ExecStart=/usr/bin/chronic /usr/bin/upnpc'
            in (refresh_service_unit.content | b64decode)
        msg: "Refresh service ExecStart should be wrapped with chronic"

    - name: "Get refresh timer status"
      ansible.builtin.systemd:
        name: "upnpc-refresh-9090-tcp.timer"
      register: "refresh_timer"

    - name: "Assert refresh timer is enabled and active"
      ansible.builtin.assert:
        that:
          - "refresh_timer.status.UnitFileState == 'enabled'"
          - "refresh_timer.status.ActiveState == 'active'"
        msg: "Refresh timer should be running after add role"
