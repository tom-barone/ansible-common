# AI GENERATED - Tom Barone
---
driver:
  name: "docker"
platforms:
  - name: "${TEST_NAME}"
    # tailscale_install deletes any other device on the tailnet that has its
    # hostname, so test runs at the same time must not share one
    hostname: "${TEST_NAME}-${TEST_RUN_ID}"
    image: "${MOLECULE_DOCKER_IMAGE}"
    pre_build_image: true
    # Necessary for systemd to work properly
    privileged: true
    cgroupns_mode: "host"
    command: ""
    volumes:
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
provisioner:
  name: "ansible"

scenario:
  test_sequence:
    # - dependency
    # - cleanup
    - "destroy"
    - "syntax"
    - "create"
    - "prepare"
    - "converge"
    - "idempotence"
    # - side_effect
    - "verify"
    - "cleanup"
    - "destroy"
