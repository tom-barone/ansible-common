---
- name: "Verify"
  hosts: "all"
  tasks:
    - name: "Check backup directory exists"
      ansible.builtin.stat:
        path: "/opt/postgres-backup"
      register: "backup_dir"

    - name: "Assert backup directory exists"
      ansible.builtin.assert:
        that:
          - "backup_dir.stat.exists"
          - "backup_dir.stat.isdir"

    - name: "Check backup script exists"
      ansible.builtin.stat:
        path: "/opt/postgres-backup/backup.sh"
      register: "backup_script"

    - name: "Assert backup script exists and is executable"
      ansible.builtin.assert:
        that:
          - "backup_script.stat.exists"
          - "backup_script.stat.mode == '0700'"

    - name: "Check env file exists"
      ansible.builtin.stat:
        path: "/opt/postgres-backup/env"
      register: "env_file"

    - name: "Assert env file exists with correct permissions"
      ansible.builtin.assert:
        that:
          - "env_file.stat.exists"
          - "env_file.stat.mode == '0600'"

    - name: "Check restic repository is initialized"
      ansible.builtin.command:
        cmd: >-
          bash -c
          'source /opt/postgres-backup/env
          && restic snapshots'
      changed_when: false

    - name: "Run backup script manually"
      ansible.builtin.command:
        cmd: "/opt/postgres-backup/backup.sh"
      changed_when: true

    - name: "Verify backup exists in restic repository"
      ansible.builtin.command:
        cmd: >-
          bash -c
          'source /opt/postgres-backup/env
          && restic snapshots --json'
      register: "restic_snapshots"
      changed_when: false

    - name: "Assert at least one snapshot exists"
      ansible.builtin.assert:
        that:
          - "(restic_snapshots.stdout | from_json | length) > 0"

    # Given a dump command that fails mid-stream
    # When a backup is attempted
    # Then no snapshot is created from the truncated output
    - name: "Count snapshots before failing backup"
      ansible.builtin.command:
        cmd: >-
          bash -c
          'source /opt/postgres-backup/env
          && restic snapshots --json'
      register: "snapshots_before_failure"
      changed_when: false

    - name: "Run backup with a failing dump command"
      ansible.builtin.command:
        cmd: >-
          bash -c
          'source /opt/postgres-backup/env
          && restic backup --stdin-from-command
          --stdin-filename "fail.sql" -- false'
      register: "failing_backup"
      failed_when: false
      changed_when: false

    - name: "Count snapshots after failing backup"
      ansible.builtin.command:
        cmd: >-
          bash -c
          'source /opt/postgres-backup/env
          && restic snapshots --json'
      register: "snapshots_after_failure"
      changed_when: false

    - name: "Assert failing dump created no snapshot"
      ansible.builtin.assert:
        that:
          - "failing_backup.rc != 0"
          - >-
            (snapshots_after_failure.stdout | from_json | length)
            == (snapshots_before_failure.stdout | from_json | length)

    - name: "Get backup timer status"
      ansible.builtin.systemd:
        name: "postgres-restic-backup.timer"
      register: "backup_timer"

    - name: "Assert backup timer is enabled and active"
      ansible.builtin.assert:
        that:
          - "backup_timer.status.UnitFileState == 'enabled'"
          - "backup_timer.status.ActiveState == 'active'"

    - name: "Read timer unit file"
      ansible.builtin.slurp:
        src: "/etc/systemd/system/postgres-restic-backup.timer"
      register: "timer_unit"

    - name: "Assert timer schedule is configured"
      vars:
        content: "{{ timer_unit.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'OnCalendar=*-*-* 03:00:00 UTC' in content"
          - "'Persistent=true' in content"

    - name: "Read service unit file"
      ansible.builtin.slurp:
        src: "/etc/systemd/system/postgres-restic-backup.service"
      register: "service_unit"

    - name: "Assert service runs the backup script"
      vars:
        content: "{{ service_unit.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'ExecStart=/opt/postgres-backup/backup.sh' in content"
          - "'OnFailure=email-root@%n.service' in content"

    - name: "Check verify script exists"
      ansible.builtin.stat:
        path: "/opt/postgres-backup/verify.sh"
      register: "verify_script"

    - name: "Assert verify script exists and is executable"
      ansible.builtin.assert:
        that:
          - "verify_script.stat.exists"
          - "verify_script.stat.mode == '0700'"

    - name: "Run verify script manually"
      ansible.builtin.command:
        cmd: "/opt/postgres-backup/verify.sh"
      changed_when: true

    - name: "Get verify timer status"
      ansible.builtin.systemd:
        name: "postgres-restic-backup-verify.timer"
      register: "verify_timer"

    - name: "Assert verify timer is enabled and active"
      ansible.builtin.assert:
        that:
          - "verify_timer.status.UnitFileState == 'enabled'"
          - "verify_timer.status.ActiveState == 'active'"

    - name: "Read verify timer unit file"
      ansible.builtin.slurp:
        src: "/etc/systemd/system/postgres-restic-backup-verify.timer"
      register: "verify_timer_unit"

    - name: "Assert verify timer schedule is configured"
      vars:
        content: "{{ verify_timer_unit.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'OnCalendar=Sun *-*-* 04:00:00 UTC' in content"
          - "'Persistent=true' in content"

    - name: "Read verify service unit file"
      ansible.builtin.slurp:
        src: "/etc/systemd/system/postgres-restic-backup-verify.service"
      register: "verify_service_unit"

    - name: "Assert verify service runs the verify script"
      vars:
        content: "{{ verify_service_unit.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'ExecStart=/opt/postgres-backup/verify.sh' in content"
          - "'OnFailure=email-root@%n.service' in content"

    - name: "Check legacy cron job file"
      ansible.builtin.stat:
        path: "/etc/cron.d/postgres-restic-backup"
      register: "legacy_cron"

    - name: "Assert legacy cron job file is absent"
      ansible.builtin.assert:
        that:
          - "not legacy_cron.stat.exists"

    - name: "Check legacy verify cron job file"
      ansible.builtin.stat:
        path: "/etc/cron.d/postgres-restic-backup-verify"
      register: "legacy_verify_cron"

    - name: "Assert legacy verify cron job file is absent"
      ansible.builtin.assert:
        that:
          - "not legacy_verify_cron.stat.exists"

    - name: "Check legacy verify directory"
      ansible.builtin.stat:
        path: "/opt/postgres-backup-verify"
      register: "legacy_verify_dir"

    - name: "Assert legacy verify directory is absent"
      ansible.builtin.assert:
        that:
          - "not legacy_verify_dir.stat.exists"

    - name: "Query restored marker row"
      ansible.builtin.command:
        cmd: >-
          docker exec postgres
          psql -U postgres -d bootstrap_restore_test -t -A -c
          "SELECT id FROM marker;"
      register: "marker_query"
      changed_when: false

    - name: "Assert restored data matches"
      ansible.builtin.assert:
        that:
          - "marker_query.stdout | trim == '42'"
