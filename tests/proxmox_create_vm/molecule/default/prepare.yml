---
- name: "Prepare"
  hosts: "all"
  tasks:
    - name: "Create image directory"
      ansible.builtin.file:
        path: "/root/images"
        state: "directory"
        mode: "0755"

    - name: "Create a dummy cloud image"
      ansible.builtin.command:
        cmd: "qemu-img create -f qcow2 /root/images/test-debian.qcow2 1G"
        creates: "/root/images/test-debian.qcow2"

    - name: "Create template to clone from"
      ansible.builtin.include_role:
        name: "proxmox_create_debian_template"
      vars:
        proxmox_create_debian_template_id: 9000
        proxmox_create_debian_template_name: "test-debian-template"
        proxmox_create_debian_template_image_url: >-
          file:///root/images/test-debian.qcow2
