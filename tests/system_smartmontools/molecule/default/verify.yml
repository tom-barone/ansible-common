---
- name: "Verify"
  hosts: "all"
  tasks:
    - name: "Check smartmontools package is installed"
      ansible.builtin.command: "dpkg -s smartmontools"
      changed_when: false

    - name: "Read smartd.conf"
      ansible.builtin.slurp:
        src: "/etc/smartd.conf"
      register: "smartd_conf"

    # Explicit entries first (the usb-NoSmart one replaces its discovered
    # line), then one line per discovered disk with base plus class options.
    - name: "Assert smartd.conf matches the expected device lines"
      vars:
        base: "-a -n standby,q -s (S/../.././02|L/../../6/03) -m root"
        expected:
          - "# Managed by Ansible role: system_smartmontools"
          - "/dev/sda -a -m root"
          - "/dev/disk/by-id/usb-NoSmart -d ignore"
          - "/dev/disk/by-id/wwn-0xhdd {{ base }} -o on -S on -W 4,45,55"
          - "/dev/disk/by-id/wwn-0xssd {{ base }} -o on -S on -W 0,55,65"
          - "/dev/disk/by-id/nvme-eui.1 {{ base }} -W 0,65,75"
          - "/dev/disk/by-id/usb-Elements {{ base }} -d sat -W 4,45,55"
      ansible.builtin.assert:
        that:
          - "(smartd_conf.content | b64decode).splitlines() == expected"
        msg: "Unexpected smartd.conf: {{ smartd_conf.content | b64decode }}"

    - name: "Get smartmontools service status"
      ansible.builtin.systemd:
        name: "smartmontools"
      register: "smartmontools_service"

    - name: "Assert smartmontools service is enabled"
      ansible.builtin.assert:
        that:
          - "smartmontools_service.status.UnitFileState == 'enabled'"
        msg: "smartmontools service is not enabled"
