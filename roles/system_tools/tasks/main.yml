---
# Ansible role to install helpful system tools

- name: "Install system tools"
  ansible.builtin.apt:
    name:
      - "btm"
      - "ncdu"
      - "tmux"
      - "vim"
    state: "present"
    update_cache: true
    cache_valid_time: 3600

- name: "Set default editor to vim"
  community.general.alternatives:
    name: "editor"
    path: "/usr/bin/vim.basic"
