---
- name: "Validate required variables"
  ansible.builtin.assert:
    that:
      - "postgres_restic_backup_verify_queries is defined"
      - "postgres_restic_backup_verify_queries | length > 0"
      - "postgres_restic_backup_verify_env_file is defined"
      - "postgres_restic_backup_verify_env_file | length > 0"
      - "postgres_restic_backup_verify_postgres_image is defined"
      - "postgres_restic_backup_verify_postgres_image | length > 0"
      - "postgres_restic_backup_verify_container_name is defined"
      - "postgres_restic_backup_verify_container_name | length > 0"
      - "postgres_restic_backup_verify_postgres_user is defined"
      - "postgres_restic_backup_verify_postgres_user | length > 0"
      - "postgres_restic_backup_verify_postgres_database is defined"
      - "postgres_restic_backup_verify_postgres_database | length > 0"
    msg: "Missing a required variable"

- name: "Install required packages"
  ansible.builtin.apt:
    name:
      - "restic"
    state: "present"
    update_cache: true

- name: "Apply system_email_root_service role"
  ansible.builtin.include_role:
    name: "system_email_root_service"

- name: "Create verify directory"
  ansible.builtin.file:
    path: "{{ postgres_restic_backup_verify_dir }}"
    state: "directory"
    mode: "0755"

- name: "Deploy verify script"
  ansible.builtin.template:
    src: "verify.sh.j2"
    dest: "{{ postgres_restic_backup_verify_dir }}/verify.sh"
    mode: "0700"

- name: "Deploy verify systemd service"
  ansible.builtin.template:
    src: "postgres-restic-backup-verify.service.j2"
    dest: "/etc/systemd/system/postgres-restic-backup-verify.service"
    mode: "0644"
  notify: "Restart postgres backup verify timer"

- name: "Deploy verify systemd timer"
  ansible.builtin.template:
    src: "postgres-restic-backup-verify.timer.j2"
    dest: "/etc/systemd/system/postgres-restic-backup-verify.timer"
    mode: "0644"
  notify: "Restart postgres backup verify timer"

- name: "Enable and start verify timer"
  ansible.builtin.systemd:
    name: "postgres-restic-backup-verify.timer"
    enabled: true
    state: "started"
    daemon_reload: true

- name: "Remove legacy cron job"
  ansible.builtin.file:
    path: "/etc/cron.d/postgres-restic-backup-verify"
    state: "absent"
