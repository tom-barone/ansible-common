---
# Required vars:
# immich_install_db_password: "secret"
# immich_install_network: "immich"
#
# The database is not part of this role. Immich needs a PostgreSQL on
# immich_install_network with the VectorChord extension available, a
# superuser login and an existing database named
# immich_install_db_database_name. postgres_pgbackrest_install built on
# Immich's own postgres image provides that; see
# tests/immich_install/molecule/default/prepare.yml for the wiring.

immich_install_version: "v3.0.2"
immich_install_dir: "/opt/immich"
immich_install_upload_location: "/opt/immich/data"
immich_install_host: "0.0.0.0"
immich_install_port: 2283
immich_install_machine_learning: true
immich_install_db_hostname: "postgres"
immich_install_db_port: 5432
immich_install_db_username: "postgres"
immich_install_db_database_name: "immich"
immich_install_server_container_name: "immich_server"
immich_install_ml_container_name: "immich_machine_learning"
immich_install_redis_container_name: "immich_redis"
immich_install_valkey_image: "docker.io/valkey/valkey:9"
