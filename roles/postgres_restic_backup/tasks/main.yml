---
- name: "Validate required variables"
  ansible.builtin.assert:
    that:
      - "postgres_restic_backup_repository is defined"
      - "postgres_restic_backup_repository | length > 0"
      - "postgres_restic_backup_env is mapping"
      - "postgres_restic_backup_restic_password is defined"
      - "postgres_restic_backup_restic_password | length > 0"
      - "postgres_restic_backup_postgres_user is defined"
      - "postgres_restic_backup_postgres_user | length > 0"
      - "postgres_restic_backup_postgres_container is defined"
      - "postgres_restic_backup_postgres_container | length > 0"
    msg: "Missing a required variable"

- name: "Apply restic_backup role"
  ansible.builtin.include_role:
    name: "restic_backup"
  vars:
    restic_backup_dir: "{{ postgres_restic_backup_dir }}"
    restic_backup_timer_schedule: >-
      {{ postgres_restic_backup_timer_schedule }}
    restic_backup_verify_timer_schedule: >-
      {{ postgres_restic_backup_verify_timer_schedule }}
    restic_backup_verify_read_data_subset: >-
      {{ postgres_restic_backup_verify_read_data_subset }}
    restic_backup_job_name: "postgres-restic-backup"
    restic_backup_retention_daily: >-
      {{ postgres_restic_backup_retention_daily }}
    restic_backup_retention_weekly: >-
      {{ postgres_restic_backup_retention_weekly }}
    restic_backup_retention_monthly: >-
      {{ postgres_restic_backup_retention_monthly }}
    restic_backup_repository: >-
      {{ postgres_restic_backup_repository }}
    restic_backup_env: "{{ postgres_restic_backup_env }}"
    restic_backup_restic_password: >-
      {{ postgres_restic_backup_restic_password }}
    # --stdin-from-command discards the snapshot if pg_dumpall
    # fails, so a truncated dump never becomes "latest"
    restic_backup_command: >-
      restic backup --stdin-from-command
      --stdin-filename "pg_dumpall.sql" --
      docker exec {{ postgres_restic_backup_postgres_container }}
      pg_dumpall -U {{ postgres_restic_backup_postgres_user }}

- name: "Check restic repo for existing snapshots"
  ansible.builtin.command:
    cmd: >-
      bash -c 'source {{ postgres_restic_backup_dir }}/env
      && restic snapshots --json --latest 1'
  register: "postgres_restic_backup_latest_snapshots"
  changed_when: false
  when: "postgres_restic_backup_restore_on_bootstrap | bool"

- name: "Count user data in running postgres"
  ansible.builtin.command:
    cmd: >-
      docker exec {{ postgres_restic_backup_postgres_container }}
      psql -U {{ postgres_restic_backup_postgres_user }} -t -A -c
      "{{ postgres_restic_backup_restore_guard_query }}"
  register: "postgres_restic_backup_user_data_count"
  changed_when: false
  when: "postgres_restic_backup_restore_on_bootstrap | bool"

- name: "Decide whether to bootstrap-restore"
  ansible.builtin.set_fact:
    postgres_restic_backup_should_restore: >-
      {{
        postgres_restic_backup_restore_on_bootstrap | bool
        and (postgres_restic_backup_latest_snapshots.stdout
             | default('[]') | from_json | length) > 0
        and (postgres_restic_backup_user_data_count.stdout
             | default('0') | trim | int) == 0
      }}
  when: "postgres_restic_backup_restore_on_bootstrap | bool"

- name: "Restore latest pg_dumpall snapshot into postgres"
  ansible.builtin.shell:
    cmd: >-
      set -euo pipefail;
      source {{ postgres_restic_backup_dir }}/env;
      restic dump latest pg_dumpall.sql
      | docker exec -i {{ postgres_restic_backup_postgres_container }}
      psql -U {{ postgres_restic_backup_postgres_user }} -d postgres
    executable: "/bin/bash"
  when:
    - "postgres_restic_backup_restore_on_bootstrap | bool"
    - "postgres_restic_backup_should_restore | bool"
  changed_when: true

# TODO: remove once this has run on all hosts
- name: "Remove legacy verify cron job"
  ansible.builtin.file:
    path: "/etc/cron.d/postgres-restic-backup-verify"
    state: "absent"

# TODO: remove once this has run on all hosts
- name: "Remove legacy verify directory"
  ansible.builtin.file:
    path: "/opt/postgres-backup-verify"
    state: "absent"
