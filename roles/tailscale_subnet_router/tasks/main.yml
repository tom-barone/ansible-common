---
- name: "Validate variables"
  ansible.builtin.assert:
    that:
      - "tailscale_subnet_router_routes is not string"
    msg: "tailscale_subnet_router_routes must be a list of subnets"

- name: "Enable IP forwarding"
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: "/etc/sysctl.d/99-tailscale.conf"
    state: "present"
    reload: true
  loop:
    - "net.ipv4.ip_forward"
    - "net.ipv6.conf.all.forwarding"

- name: "Discover local subnets"
  ansible.builtin.command:
    argv: ["ip", "-json", "route", "show", "proto", "kernel", "scope", "link"]
  register: "tailscale_subnet_router_discovered"
  changed_when: false
  check_mode: false
  when: "tailscale_subnet_router_routes | length == 0"

- name: "Set desired routes fact"
  ansible.builtin.set_fact:
    tailscale_subnet_router_desired: >-
      {{ tailscale_subnet_router_routes
         or (tailscale_subnet_router_discovered.stdout | from_json
             | rejectattr('dev', 'equalto', 'tailscale0')
             | map(attribute='dst') | list) }}

- name: "Fail if no routes discovered"
  ansible.builtin.fail:
    msg: >-
      No local subnets discovered.
      Set tailscale_subnet_router_routes manually.
  when: "tailscale_subnet_router_desired | length == 0"

# Prints the subnet routes only. The default routes of an exit node, which
# Tailscale keeps in the same list, are left out.
- name: "Get advertised routes"
  ansible.builtin.command:
    argv: ["tailscale", "get", "advertise-routes"]
  register: "tailscale_subnet_router_advertised"
  changed_when: false
  check_mode: false

- name: "Advertise routes"
  ansible.builtin.command:
    argv:
      - "tailscale"
      - "set"
      - "--advertise-routes={{ tailscale_subnet_router_desired | join(',') }}"
  when: >-
    tailscale_subnet_router_advertised.stdout.split(',') | select | list
    | symmetric_difference(tailscale_subnet_router_desired) | length > 0
  changed_when: true
