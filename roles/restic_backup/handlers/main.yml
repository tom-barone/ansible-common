---
- name: "Restart backup timer"
  ansible.builtin.systemd:
    name: "{{ restic_backup_job_name }}.timer"
    state: "restarted"
    daemon_reload: true

- name: "Restart verify timer"
  ansible.builtin.systemd:
    name: "{{ restic_backup_job_name }}-verify.timer"
    state: "restarted"
    daemon_reload: true
