---
- name: "Validate required variables"
  ansible.builtin.assert:
    that:
      - "restic_backup_repository is defined"
      - "restic_backup_repository | length > 0"
      - "restic_backup_env is mapping"
      - "restic_backup_restic_password is defined"
      - "restic_backup_restic_password | length > 0"
      - "restic_backup_dir is defined"
      - "restic_backup_dir | length > 0"
      - "restic_backup_job_name is defined"
      - "restic_backup_job_name | length > 0"
      - "restic_backup_command is defined"
      - "restic_backup_command | length > 0"
    msg: "Missing a required variable"

- name: "Install required packages"
  ansible.builtin.apt:
    name:
      - "restic"
    state: "present"
    update_cache: true
    cache_valid_time: 3600

- name: "Apply system_email_root_service role"
  ansible.builtin.include_role:
    name: "system_email_root_service"

- name: "Create backup directory"
  ansible.builtin.file:
    path: "{{ restic_backup_dir }}"
    state: "directory"
    mode: "0755"

- name: "Deploy environment file"
  ansible.builtin.template:
    src: "env.j2"
    dest: "{{ restic_backup_dir }}/env"
    mode: "0600"

- name: "Deploy backup script"
  ansible.builtin.template:
    src: "backup.sh.j2"
    dest: "{{ restic_backup_dir }}/backup.sh"
    mode: "0700"

- name: "Check if restic repository is initialized"
  ansible.builtin.command:
    cmd: >-
      bash -c
      'source {{ restic_backup_dir }}/env
      && restic snapshots'
  register: "restic_backup_repo_check"
  failed_when: false
  changed_when: false

- name: "Initialize restic repository"
  ansible.builtin.command:
    cmd: >-
      bash -c
      'source {{ restic_backup_dir }}/env
      && restic init'
  when: "restic_backup_repo_check.rc != 0"
  changed_when: true

- name: "Deploy backup systemd service"
  ansible.builtin.template:
    src: "backup.service.j2"
    dest: "/etc/systemd/system/{{ restic_backup_job_name }}.service"
    mode: "0644"
  notify: "Restart backup timer"

- name: "Deploy backup systemd timer"
  ansible.builtin.template:
    src: "backup.timer.j2"
    dest: "/etc/systemd/system/{{ restic_backup_job_name }}.timer"
    mode: "0644"
  notify: "Restart backup timer"

- name: "Enable and start backup timer"
  ansible.builtin.systemd:
    name: "{{ restic_backup_job_name }}.timer"
    enabled: true
    state: "started"
    daemon_reload: true

- name: "Remove legacy cron job"
  ansible.builtin.file:
    path: "/etc/cron.d/{{ restic_backup_job_name }}"
    state: "absent"
