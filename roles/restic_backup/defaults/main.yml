---
# Required vars:
# restic_backup_repository: "s3:s3.amazonaws.com/my-backups/my-app"
# restic_backup_restic_password: "secret"
# restic_backup_dir: "/opt/my-app-backup"
# restic_backup_job_name: "my-app-backup"
# restic_backup_path: "/opt/my-app/data" (used by default restic_backup_command)
#
# Backend credentials go in restic_backup_env, e.g.:
# restic_backup_env:
#   AWS_ACCESS_KEY_ID: "AKIA..."
#   AWS_SECRET_ACCESS_KEY: "secret"

restic_backup_env: {}
restic_backup_timer_schedule: "*-*-* 03:00:00 UTC"
restic_backup_verify_timer_schedule: "Sun *-*-* 05:00:00 UTC"
restic_backup_verify_read_data_subset: "50M"
restic_backup_retention_daily: 7
restic_backup_retention_weekly: 4
restic_backup_retention_monthly: 9999
restic_backup_forget_group_by: "host,paths"
restic_backup_command: >-
  restic backup {{ restic_backup_path }}
