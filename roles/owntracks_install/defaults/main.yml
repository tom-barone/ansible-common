---
# Passwords must not contain a colon.
#
# Required vars:
# MQTT password of the Recorder's own account on the broker
# owntracks_install_recorder_password: "secret"

# MQTT accounts for the phone apps, as username: password. A user may
# publish under owntracks/<username>/ and read everyone's locations.
# owntracks_install_users:
#   jane: "secret"
#   john: "secret"
owntracks_install_users: {}

# Plain MQTT, for a reverse proxy that terminates TLS
owntracks_install_mqtt_port: 1883

# Listen address of the Recorder's API and map pages, on port 8083. They
# have no login, so only set "0.0.0.0" where something else limits who can
# reach the port, such as Tailscale ACLs.
owntracks_install_host: "127.0.0.1"
