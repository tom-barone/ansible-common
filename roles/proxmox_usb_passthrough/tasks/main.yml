---
# Ansible role to pass a USB device plugged into a Proxmox host through to
# a VM.
#
# The device is named the way Proxmox addresses USB devices: by its USB
# vendor:product ID (from lsusb on the host) or by bus-port. Both survive
# reboots and do not depend on device names like sdb. Two identical devices
# cannot be told apart by ID, so use bus-port for those.
#
# A running VM is restarted and waited for when the device is first added,
# so the guest gets it whether or not Proxmox could hot-plug it. A stopped
# VM gets the device at its next start.
#
# Tests to confirm working:
#   $ qm config <id>
#     -> "usb0: host=0781:5583"
#   $ lsusb   (in the guest)

- name: "Validate required variables"
  ansible.builtin.assert:
    that:
      - "proxmox_usb_passthrough_vm_id is defined"
      - "proxmox_usb_passthrough_device is defined"
    msg: "Missing a required variable"

- name: "Read VM config"
  ansible.builtin.command:
    argv:
      - "qm"
      - "config"
      - "{{ proxmox_usb_passthrough_vm_id }}"
  register: "proxmox_usb_passthrough_config"
  changed_when: false

- name: "Pass the USB device through to the VM"
  ansible.builtin.command:
    argv:
      - "qm"
      - "set"
      - "{{ proxmox_usb_passthrough_vm_id }}"
      - "--usb{{ proxmox_usb_passthrough_index }}"
      - "host={{ proxmox_usb_passthrough_device }},usb3=1"
  when: >-
    'usb' ~ proxmox_usb_passthrough_index ~ ': host='
    ~ proxmox_usb_passthrough_device
    not in proxmox_usb_passthrough_config.stdout
  register: "proxmox_usb_passthrough_set"
  changed_when: true
  notify: "Refresh smartd device list"

- name: "Read VM status"
  ansible.builtin.command:
    argv:
      - "qm"
      - "status"
      - "{{ proxmox_usb_passthrough_vm_id }}"
  register: "proxmox_usb_passthrough_status"
  changed_when: false

# qm reboot returns before the VM is started again, and the smartd handler
# needs QEMU to hold the device, so shut down and start instead.
- name: "Restart a running VM to attach the USB device"
  when:
    - "proxmox_usb_passthrough_set is changed"
    - "'status: running' in proxmox_usb_passthrough_status.stdout"
  block:
    - name: "Apply proxmox_shutdown_vm role"
      ansible.builtin.include_role:
        name: "proxmox_shutdown_vm"
      vars:
        proxmox_shutdown_vm_id: "{{ proxmox_usb_passthrough_vm_id }}"

    - name: "Apply proxmox_start_vm role"
      ansible.builtin.include_role:
        name: "proxmox_start_vm"
      vars:
        proxmox_start_vm_id: "{{ proxmox_usb_passthrough_vm_id }}"

    - name: "Apply proxmox_wait_for_vm role"
      ansible.builtin.include_role:
        name: "proxmox_wait_for_vm"
      vars:
        proxmox_wait_for_vm_id: "{{ proxmox_usb_passthrough_vm_id }}"
