---
- name: "Validate required variables"
  ansible.builtin.assert:
    that:
      - "immich_restic_backup_verify_dir is defined"
      - "immich_restic_backup_verify_dir | length > 0"
      - "immich_restic_backup_verify_env_file is defined"
      - "immich_restic_backup_verify_env_file | length > 0"
      - "immich_restic_backup_verify_db_dump_path is defined"
      - "immich_restic_backup_verify_db_dump_path | length > 0"
      - "immich_restic_backup_verify_read_data_subset is defined"
      - "immich_restic_backup_verify_read_data_subset | length > 0"
      - "immich_restic_backup_verify_sample_count is defined"
      - "immich_restic_backup_verify_sample_count | int > 0"
    msg: "Missing a required variable"

- name: "Install required packages"
  ansible.builtin.apt:
    name:
      - "restic"
      - "jq"
    state: "present"
    update_cache: true

- name: "Apply system_email_root_service role"
  ansible.builtin.include_role:
    name: "system_email_root_service"

- name: "Create verify directory"
  ansible.builtin.file:
    path: "{{ immich_restic_backup_verify_dir }}"
    state: "directory"
    mode: "0755"

- name: "Deploy verify script"
  ansible.builtin.template:
    src: "verify.sh.j2"
    dest: "{{ immich_restic_backup_verify_dir }}/verify.sh"
    mode: "0700"

- name: "Deploy verify systemd service"
  ansible.builtin.template:
    src: "immich-restic-backup-verify.service.j2"
    dest: "/etc/systemd/system/immich-restic-backup-verify.service"
    mode: "0644"
  notify: "Restart immich backup verify timer"

- name: "Deploy verify systemd timer"
  ansible.builtin.template:
    src: "immich-restic-backup-verify.timer.j2"
    dest: "/etc/systemd/system/immich-restic-backup-verify.timer"
    mode: "0644"
  notify: "Restart immich backup verify timer"

- name: "Enable and start verify timer"
  ansible.builtin.systemd:
    name: "immich-restic-backup-verify.timer"
    enabled: true
    state: "started"
    daemon_reload: true

- name: "Remove legacy cron job"
  ansible.builtin.file:
    path: "/etc/cron.d/immich-restic-backup-verify"
    state: "absent"
