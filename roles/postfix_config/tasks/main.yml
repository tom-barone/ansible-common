---
- name: "Install postfix"
  ansible.builtin.apt:
    name: "postfix"
    state: "present"
    update_cache: true
    cache_valid_time: 3600
  register: "postfix_config_apt_result"
  retries: 3
  delay: 10
  until: "postfix_config_apt_result is success"

- name: "Set inet_protocols"
  ansible.builtin.lineinfile:
    path: "/etc/postfix/main.cf"
    regexp: "^inet_protocols"
    line: "inet_protocols = {{ postfix_config_inet_protocols }}"
    backup: true
  notify: "Restart postfix"
  when: "postfix_config_inet_protocols is defined"
