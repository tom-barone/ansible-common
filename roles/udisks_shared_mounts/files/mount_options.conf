# whose session mounted them the owner of every file. Each key replaces
# the builtin default for that filesystem, so repeat it and add masks
# that let every user write.
# https://storaged.org/doc/udisks2-api/latest/mount_options.html
[defaults]
vfat_defaults=uid=$UID,gid=$GID,shortname=mixed,utf8=1,showexec,flush,dmask=0000,fmask=0111
