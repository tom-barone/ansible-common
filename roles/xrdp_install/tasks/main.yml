# AI GENERATED - Tom Barone
---
- name: "Gather service facts"
  ansible.builtin.service_facts: {}

# GNOME's remote desktop daemon also binds port 3389
- name: "Stop GNOME remote desktop"
  ansible.builtin.systemd:
    name: "gnome-remote-desktop"
    enabled: false
    state: "stopped"
  when: "'gnome-remote-desktop.service' in ansible_facts.services"

- name: "Install xrdp"
  ansible.builtin.apt:
    name:
      # Only a Recommends of xrdp, but it is the default session backend
      - "xorgxrdp"
      - "xrdp"
    state: "present"
    update_cache: true
    cache_valid_time: 3600

# GNOME hides mounts under dot directories from the Files sidebar
- name: "Hide redirected drives mount"
  ansible.builtin.lineinfile:
    path: "/etc/xrdp/sesman.ini"
    regexp: "^FuseMountName="
    line: "FuseMountName=.thinclient_drives"

- name: "Create xdg-desktop-portal config directory"
  ansible.builtin.file:
    path: "/etc/xdg-desktop-portal"
    state: "directory"
    mode: "0755"

# xdg-desktop-portal-gnome never starts in an xrdp session, so each
# portal waits out a 25 second D-Bus timeout before falling back to GTK,
# stalling the first app window that queries the portal
- name: "Skip the GNOME portal backend"
  ansible.builtin.copy:
    content: |
      [preferred]
      default=gtk;
      org.freedesktop.impl.portal.Secret=gnome-keyring;
    dest: "/etc/xdg-desktop-portal/gnome-portals.conf"
    mode: "0644"

- name: "Enable and start xrdp"
  ansible.builtin.systemd:
    name: "xrdp"
    enabled: true
    state: "started"
