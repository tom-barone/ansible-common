---
# Run manual collection with:
# $ docker exec scrutiny scrutiny-collector-metrics run

scrutiny_docker_install_version: "v0.9.2-omnibus"
scrutiny_docker_install_dir: "/opt/scrutiny"
scrutiny_docker_install_port: 8080
scrutiny_docker_install_container_name: "scrutiny"

# Disks are discovered with lsblk and keyed by /dev/disk/by-id/<ID-LINK>.
# The smartctl device type is "nvme" for TRAN nvme and "sat" otherwise (SATA
# disks and USB enclosures).
# Explicit entries win over discovery. Each entry is a collector.yaml device:
#   { device: "/dev/disk/by-id/<ID-LINK>", type: "<smartctl -d type>" }
#   { device: "/dev/disk/by-id/<ID-LINK>", ignore: true }
# A type that contains a comma must be a list, e.g. ["sat,auto"].
# Use the same /dev/disk/by-id/<ID-LINK> path as `lsblk -dn -o ID-LINK` to
# replace or drop a discovered disk, e.g. ignore a USB enclosure that passes
# no SMART data.
scrutiny_docker_install_devices: []

# Shoutrrr notification URLs. Special characters in usernames / passwords
# must be URL-encoded by the caller — they are passed through to Shoutrrr
# verbatim. e.g. user "myname@example.com" + password "124@34$1" becomes
# "smtp://myname%40example%2Ecom:124%4034%241@host:587"
# See https://shoutrrr.nickfedor.com/services/overview/
scrutiny_docker_install_notify_urls: []

# Whether Scrutiny should keep re-sending notifications for a device that
# stays in a failing state. Applied via /api/settings on each run.
scrutiny_docker_install_repeat_notifications: false
