---
# Tests to confirm working:
#   $ lsblk -dn -o NAME,TYPE,TRAN,ID-LINK
#   $ cat /opt/scrutiny/config/collector.yaml
#   $ docker exec scrutiny scrutiny-collector-metrics run

- name: "Discover physical disks"
  ansible.builtin.command: "lsblk -dJ -o TYPE,TRAN,ID-LINK"
  register: "_scrutiny_docker_install_lsblk"
  changed_when: false
  check_mode: false

# Explicit entries first, then every discovered disk that has a transport
# and a by-id link and is not listed explicitly.
- name: "Build the list of monitored devices"
  ansible.builtin.set_fact:
    _scrutiny_docker_install_devices: >-
      {%- set devices = scrutiny_docker_install_devices
        | rejectattr('ignore', 'defined') | list -%}
      {%- set explicit = scrutiny_docker_install_devices
        | map(attribute='device') | list -%}
      {%- set lsblk = _scrutiny_docker_install_lsblk.stdout | from_json -%}
      {%- for d in lsblk.blockdevices
        if d.type == 'disk' and d.tran and d['id-link'] -%}
      {%- set device = '/dev/disk/by-id/' ~ d['id-link'] -%}
      {%- set type = 'nvme' if d.tran == 'nvme' else 'sat' -%}
      {%- if device not in explicit -%}
      {%- set _ = devices.append({'device': device, 'type': type}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ devices }}

- name: "Create install directory"
  ansible.builtin.file:
    path: "{{ scrutiny_docker_install_dir }}"
    state: "directory"
    mode: "0755"

- name: "Create scrutiny config directory"
  ansible.builtin.file:
    path: "{{ scrutiny_docker_install_dir }}/config"
    state: "directory"
    mode: "0755"

- name: "Deploy scrutiny.yaml"
  ansible.builtin.template:
    src: "scrutiny.yaml.j2"
    dest: "{{ scrutiny_docker_install_dir }}/config/scrutiny.yaml"
    mode: "0644"
  when:
    - "scrutiny_docker_install_notify_urls | length > 0"
  notify: "Restart scrutiny"

- name: "Deploy collector.yaml"
  ansible.builtin.template:
    src: "collector.yaml.j2"
    dest: "{{ scrutiny_docker_install_dir }}/config/collector.yaml"
    mode: "0644"
  notify: "Restart scrutiny"

- name: "Deploy docker-compose.yml"
  ansible.builtin.template:
    src: "docker-compose.yml.j2"
    dest: "{{ scrutiny_docker_install_dir }}/docker-compose.yml"
    mode: "0644"
  notify: "Restart scrutiny"

- name: "Start scrutiny"
  ansible.builtin.command:
    cmd: "docker compose up -d"
    chdir: "{{ scrutiny_docker_install_dir }}"
  register: "scrutiny_docker_install_up"
  changed_when: >
    'Started' in scrutiny_docker_install_up.stderr or
    'Created' in scrutiny_docker_install_up.stderr

- name: "Flush handlers so any pending restart fires before API tasks"
  ansible.builtin.meta: "flush_handlers"

- name: "Wait for Scrutiny API to be ready"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ scrutiny_docker_install_port }}/api/health"
    status_code: 200
  register: "scrutiny_docker_install_health"
  until: "scrutiny_docker_install_health.status == 200"
  retries: 60
  delay: 5

- name: "Read current Scrutiny settings"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ scrutiny_docker_install_port }}/api/settings"
    method: "GET"
    return_content: true
  register: "scrutiny_docker_install_settings"

- name: "Apply desired Scrutiny settings (preserve everything else)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ scrutiny_docker_install_port }}/api/settings"
    method: "POST"
    body_format: "json"
    status_code: 200
    body: >-
      {{
        scrutiny_docker_install_settings.json.settings | combine({
          'metrics': {
            'repeat_notifications': scrutiny_docker_install_repeat_notifications
          }
        }, recursive=true)
      }}
  when:
    - >-
      scrutiny_docker_install_settings.json.settings.metrics.repeat_notifications
      != scrutiny_docker_install_repeat_notifications
