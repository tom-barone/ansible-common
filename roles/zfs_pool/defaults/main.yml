---
# AI GENERATED - Tom Barone
# Imports the pool if it exists, otherwise creates it from zfs_pool_disks
# Required vars:
# zfs_pool_name: "tank"
# zfs_pool_disks:
#   - "/dev/disk/by-id/ata-XXXX"
#   - "/dev/disk/by-id/ata-YYYY"
#   - "/dev/disk/by-id/ata-ZZZZ"

# Only applies when creating the pool
# One of "stripe", "mirror", "raidz1", "raidz2", "raidz3"
zfs_pool_type: "raidz2"
# An existing pool is moved here. /media/ makes it show up in the file
# manager, /mnt/ does not. To show a pool that is somewhere else, give
# it an fstab entry that ZFS keeps mounting itself, with system_mount:
# system_mount_path: "/mnt/tank"
# system_mount_state: "present"
# system_mount_src: "tank"
# system_mount_fstype: "zfs"
# system_mount_opts: "noauto,zfsutil,x-gvfs-show"
zfs_pool_mountpoint: "/media/{{ zfs_pool_name }}"
# Import a pool last used by another system, e.g. after an OS reinstall
# without running zpool export first
zfs_pool_force_import: false
